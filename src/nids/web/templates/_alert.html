<li class="alert-item src-{{ inc.source }}" data-id="{{ inc.id }}">
  <button class="alert" hx-get="/alertas/{{ day }}/{{ inc.id }}" hx-target="#detail" hx-swap="innerHTML"
          aria-label="{{ inc.family | family }}, {{ inc.source | source }}, {{ time }}">
    <span class="a-glyph" aria-hidden="true">{{ '■' if inc.source == 'rules' else '▼' }}</span>
    <span class="a-family">{{ inc.family | family }}</span>
    <span class="a-time">{{ time }}</span>
    <span class="a-route">{{ inc.src_ip }} → {{ inc.dst_ip }}</span>
    <span class="a-n"><span id="n-{{ inc.id }}">{{ n | number }}</span> flujo<span class="pl">{{ '' if n == 1 else 's' }}</span>{% if inc.confidence is not none %}, {{ inc.confidence | percent(0) }}{% endif %}</span>
  </button>
</li>
