# Configuración única del proyecto. Todo lo que influye en los resultados está aquí,
# para que cualquier cifra de reports/ se pueda reproducir.

# Semilla global: se pasa explícitamente a cada modelo (random_state) y a NumPy.
seed: 42

# Recursos: hilos que pueden usar LightGBM y compañía. Con pocos el ordenador sigue usable.
n_jobs: 4

# Rutas relativas a la raíz del repositorio. data/ y models/ no se suben (ver .gitignore).
paths:
  raw_data: data/raw
  processed_data: data/processed
  models: models
  reports: reports

dataset:
  cicids2017:
    # Versión corregida de Engelen, Rimmer y Joosen (2021), DistriNet (KU Leuven).
    # Enlace verificado el 2026-10-20 en
    # https://intrusion-detection.distrinet-research.be/CNS2022/Dataset_Download.html
    # (ZIP de 343 549 013 bytes, modificado el 2023-04-27). Los autores no publican checksum:
    # este SHA-256 se calculó en la primera descarga y sirve para detectar cambios o corrupción.
    url: https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/CICIDS2017_improved.zip
    sha256: 97fdb91d339e2d8cf5627f981b831e5e7e400b981c58181c451a38fd03c48883
    days: [monday, tuesday, wednesday, thursday, friday]
    # Las marcas de tiempo vienen en UTC. El laboratorio (UNB, New Brunswick) estaba en UTC-3
    # en julio de 2017: el lunes empieza a las 08:55 locales. El panel enseña la hora local.
    display_timezone: America/Moncton

# Reparto temporal (protocolo «ataques conocidos»). Nunca aleatorio.
split:
  # Dentro de cada día: el primer 70 % del tiempo es train y el 30 % final, test.
  # Si alguna familia se queda sin ejemplos en un lado, el corte se ajusta y se documenta aquí.
  train_fraction: 0.7
  # Parte final de train que se reserva como validación para elegir el umbral de decisión.
  validation_fraction: 0.2

# Modelo principal: LightGBM. Frente a XGBoost rinde parecido en datos tabulares, pero entrena
# más rápido y con menos memoria en ~3 millones de flujos en un portátil, y SHAP TreeExplainer
# lo soporta igual de bien. Valores de partida; si se ajustan, se ajustan con validación.
model:
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  # Estabilidad numérica en multiclase con familias muy raras: sin esto, el hessiano de una
  # clase con probabilidad ~0 es casi nulo, el valor de las hojas (−gradiente/hessiano) se dispara
  # y salen log-odds de millones (se vio en el umbral de validación, sin mirar test).
  min_child_weight: 1.0
  reg_lambda: 1.0
  # Con varios hilos LightGBM suma en distinto orden y los resultados cambian en la 7.ª cifra
  # decimal entre ejecuciones; así es reproducible al bit.
  deterministic: true
  force_row_wise: true

# Detector de anomalías entrenado solo con tráfico normal (protocolo «ataques nuevos»).
anomaly:
  n_estimators: 200
  max_samples: 256

# Elección de umbrales. Mismo criterio para el modelo y las reglas: el umbral más sensible cuyas
# falsas alarmas por hora (flujos normales marcados) no superan este presupuesto. Para el modelo
# se mide en validación; para las reglas, que no tienen otro ajuste, en todo lo anterior al corte
# (train + validación). Nunca en test. Es una cifra de diseño (lo que un analista podría
# revisar), no un resultado.
evaluation:
  max_false_alarms_per_hour: 10

# Reglas de umbral al estilo de un IDS clásico, por IP de origen y ventana de tiempo fija.
# Cada regla recibe un tercio del presupuesto de falsas alarmas. Una regla salta si su
# estadístico es MAYOR que el umbral. Los umbrales los calcula `make train` sin mirar test y se
# copian aquí; `make train` avisa si no coinciden.
rules:
  window_seconds: 60
  brute_force_ports: [21, 22]
  # Los intentos de Patator duran 9-12 s; «corta» = hasta 30 s.
  brute_force_max_duration_seconds: 30
  thresholds:
    # scan es tan alto porque 192.168.10.8 (la máquina infectada del jueves) tiene flujos
    # etiquetados como normales que tocan ~1000 puertos por minuto.
    scan: 1004.0         # puertos de destino distintos por IP de origen y ventana
    brute_force: 3.0     # conexiones cortas a 21/22 por IP de origen y ventana
    dos: 1809.36669921875  # paquetes por segundo de una IP de origen a una de destino

web:
  host: 127.0.0.1
  port: 8000
